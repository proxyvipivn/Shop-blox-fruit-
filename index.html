<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SHOP BÁN TRÁI BLOX FRUIT VÀ NHỮNG PHỤ KIỆN KHÁC🔑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050e24; --blue:#1e90ff; --blue2:#4facfe; --cyan:#00f2fe;
  --gold:#ffd54a; --pink:#ff6ec7; --green:#3ddc84; --red:#ff5252;
  --txt:#e8f2ff;
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Roboto',sans-serif;
  background:
    radial-gradient(circle at 8% 0%, #10306b 0%, transparent 45%),
    radial-gradient(circle at 92% 8%, #0b2a5e 0%, transparent 42%),
    radial-gradient(circle at 50% 100%, #0a2450 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt); min-height:100vh; overflow-x:hidden; line-height:1.6;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#08152f}
::-webkit-scrollbar-thumb{background:linear-gradient(#1e90ff,#00f2fe);border-radius:9px}

/* ===== KHUNG VIỀN PHÁT SÁNG ===== */
.frame{
  position:fixed;inset:6px;border-radius:16px;
  border:2px solid rgba(30,144,255,.55);
  pointer-events:none;z-index:998;
  animation:pulseFrame 3.5s ease-in-out infinite;
}
@keyframes pulseFrame{
  0%,100%{box-shadow:0 0 10px rgba(30,144,255,.7),0 0 26px rgba(30,144,255,.45),0 0 50px rgba(0,120,255,.25),inset 0 0 26px rgba(30,144,255,.18)}
  50%{box-shadow:0 0 16px rgba(0,200,255,.9),0 0 42px rgba(30,144,255,.6),0 0 72px rgba(0,120,255,.35),inset 0 0 34px rgba(30,144,255,.3)}
}

/* ===== THANH TIÊU ĐỀ ===== */
#titleBar{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(92vw,780px);text-align:center;padding:22px 26px;border-radius:18px;
  background:linear-gradient(135deg,rgba(10,26,58,.94),rgba(20,50,110,.94));
  border:1px solid rgba(30,144,255,.6);
  box-shadow:0 0 24px rgba(30,144,255,.55),inset 0 0 20px rgba(30,144,255,.15);
  transition:all 1.15s cubic-bezier(.66,0,.2,1);
  z-index:1000;cursor:pointer;
}
.title-text{
  font-size:clamp(15px,3.2vw,26px);font-weight:900;letter-spacing:.5px;
  background:linear-gradient(90deg,#00f2fe,#4facfe,#ffd54a,#ff6ec7,#00f2fe);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;
  filter:drop-shadow(0 0 14px rgba(79,172,254,.55));
}
@keyframes shine{to{background-position:300% 0}}
#titleBar.loaded{
  top:0;left:0;transform:translate(0,0);width:100%;border-radius:0;
  padding:12px 64px 12px 16px;text-align:left;
  background:linear-gradient(90deg,rgba(5,14,36,.98),rgba(16,48,107,.98));
  border:none;border-bottom:2px solid rgba(30,144,255,.85);
  box-shadow:0 4px 26px rgba(30,144,255,.45);
}
#titleBar.loaded .title-text{font-size:clamp(12px,2.4vw,17px)}

/* ===== LOADER ===== */
#loader{
  position:fixed;top:calc(50% + 72px);left:50%;transform:translateX(-50%);
  width:min(80vw,430px);text-align:center;z-index:1001;transition:opacity .5s;
}
.load-bar{
  height:15px;border-radius:10px;background:rgba(255,255,255,.08);
  border:1px solid rgba(30,144,255,.5);overflow:hidden;
  box-shadow:0 0 14px rgba(30,144,255,.4),inset 0 0 10px rgba(0,0,0,.5);
}
.load-fill{
  height:100%;width:0%;border-radius:10px;
  background:linear-gradient(90deg,#00f2fe,#4facfe,#ffd54a,#ff6ec7,#00f2fe);
  background-size:300% 100%;animation:shine 2s linear infinite;
  box-shadow:0 0 18px rgba(79,172,254,.95);transition:width .18s ease;
}
.load-pct{
  margin-top:10px;font-weight:900;font-size:19px;color:#4facfe;
  text-shadow:0 0 14px rgba(79,172,254,.9);letter-spacing:1px;
}

/* ===== NÚT MENU 3 GẠCH ===== */
#menuBtn{
  position:fixed;top:13px;right:15px;z-index:1002;width:46px;height:46px;
  border-radius:13px;border:1px solid rgba(30,144,255,.75);
  background:linear-gradient(135deg,#12336e,#0a1a3a);
  color:#7fd3ff;font-size:23px;cursor:pointer;
  box-shadow:0 0 14px rgba(30,144,255,.65);
  display:none;align-items:center;justify-content:center;transition:.25s;
}
#menuBtn.show{display:flex}
#menuBtn:hover{box-shadow:0 0 24px rgba(30,144,255,1);transform:scale(1.07)}

/* ===== DRAWER ===== */
#drawer{
  position:fixed;top:0;right:-330px;width:310px;max-width:86vw;height:100%;
  background:linear-gradient(180deg,#08152f,#0d2450);
  border-left:2px solid rgba(30,144,255,.75);
  box-shadow:-8px 0 34px rgba(30,144,255,.35);
  z-index:1004;transition:right .38s cubic-bezier(.6,0,.2,1);
  padding:18px 14px 34px;overflow-y:auto;
}
#drawer.open{right:0}
.drawer-head{
  font-weight:900;font-size:18px;letter-spacing:2px;text-align:center;
  padding:10px 0 16px;margin-bottom:8px;
  border-bottom:1px dashed rgba(30,144,255,.4);
  background:linear-gradient(90deg,#00f2fe,#ffd54a,#ff6ec7);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
#drawer a{
  display:flex;align-items:center;gap:10px;padding:13px 14px;margin-bottom:8px;
  border-radius:12px;color:#dceaff;text-decoration:none;font-weight:700;font-size:15px;
  border:1px solid rgba(30,144,255,.25);background:rgba(30,144,255,.07);
  cursor:pointer;transition:.2s;
}
#drawer a:hover{
  background:rgba(30,144,255,.22);border-color:rgba(30,144,255,.85);
  box-shadow:0 0 14px rgba(30,144,255,.55);transform:translateX(-4px);
}
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  z-index:1003;opacity:0;visibility:hidden;transition:.3s;
}
#overlay.show{opacity:1;visibility:visible}

/* ===== NỘI DUNG ===== */
#site{display:none}
#site.show{display:block}
#view{padding:100px 16px 90px;max-width:1080px;margin:0 auto;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.sec-title{
  font-size:clamp(19px,4vw,26px);font-weight:900;text-align:center;
  margin:6px 0 16px;letter-spacing:.5px;
  background:linear-gradient(90deg,#00f2fe,#4facfe,#ffd54a,#ff6ec7);
  background-size:250% 100%;animation:shine 5s linear infinite;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 12px rgba(79,172,254,.5));
}
.sub-title{
  font-size:clamp(16px,3.4vw,21px);font-weight:900;margin:24px 0 10px;text-align:center;
  background:linear-gradient(90deg,#ffd54a,#ff9d2e,#ff6ec7);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.muted{color:#9fb8d8;font-size:14px;text-align:center;margin-bottom:12px}
.center{text-align:center}

.panel{
  background:linear-gradient(160deg,rgba(16,48,107,.6),rgba(8,21,47,.85));
  border:1px solid rgba(30,144,255,.35);border-radius:18px;
  padding:16px;margin-bottom:16px;
  box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 0 24px rgba(30,144,255,.06);
}
.panel p{margin-bottom:9px;font-size:14.5px}
.panel p:last-child{margin-bottom:0}
.warn{color:#ffd54a;font-weight:800}
.danger{color:#ff7b7b;font-weight:800}

/* GRID SẢN PHẨM */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px}
.card{
  background:linear-gradient(160deg,rgba(16,48,107,.8),rgba(8,21,47,.95));
  border:1px solid rgba(30,144,255,.4);border-radius:16px;overflow:hidden;
  cursor:pointer;transition:.25s;position:relative;
}
.card:hover{
  transform:translateY(-6px);border-color:#4facfe;
  box-shadow:0 12px 28px rgba(30,144,255,.5),0 0 20px rgba(0,242,254,.35);
}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#08152f}
.card-name{padding:9px 10px 2px;font-weight:800;font-size:14px;color:#cfe6ff;min-height:38px}
.card-price{
  padding:0 10px 12px;font-weight:900;font-size:17px;
  background:linear-gradient(90deg,#ffd54a,#ff9d2e,#ff6ec7);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* HỒ SƠ */
.profile-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.avatar{
  width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:40px;background:linear-gradient(135deg,#12336e,#0a1a3a);
  border:2px solid rgba(30,144,255,.8);box-shadow:0 0 22px rgba(30,144,255,.7);
}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.stat{
  text-align:center;padding:14px 10px;border-radius:14px;
  background:rgba(30,144,255,.1);border:1px solid rgba(30,144,255,.35);
}
.stat b{display:block;font-size:20px;font-weight:900;color:#7fd3ff;word-break:break-all}
.stat span{font-size:12.5px;color:#9fb8d8}

/* Ô NHẬP TÊN */
.name-box{
  background:linear-gradient(160deg,rgba(16,48,107,.7),rgba(8,21,47,.9));
  border:1px solid rgba(30,144,255,.45);border-radius:16px;padding:14px;margin-bottom:16px;
}
.name-box label{font-size:13px;font-weight:800;color:#7fd3ff;display:block;margin-bottom:7px}
.name-box input,.ta{
  width:100%;padding:12px 14px;border-radius:12px;
  border:1px solid rgba(30,144,255,.5);background:rgba(5,14,36,.85);
  color:#e8f2ff;font-size:15px;font-family:inherit;outline:none;transition:.2s;
}
.name-box input:focus,.ta:focus{border-color:#4facfe;box-shadow:0 0 16px rgba(30,144,255,.6)}
.name-row{display:flex;gap:8px;margin-top:10px}
.btn-s{
  flex:1;padding:11px;border-radius:11px;border:none;font-weight:800;font-size:14px;cursor:pointer;transition:.2s;
}
.btn-ok{background:linear-gradient(135deg,#00e676,#00a152);color:#04220f;box-shadow:0 0 14px rgba(0,230,118,.6)}
.btn-no{background:linear-gradient(135deg,#ff4d4d,#b30000);color:#fff;box-shadow:0 0 14px rgba(255,80,80,.55)}
.btn-s:hover{transform:translateY(-2px);filter:brightness(1.12)}

/* CHỦ ACC */
.owner-card{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:linear-gradient(160deg,rgba(16,48,107,.65),rgba(8,21,47,.9));
  border:1px solid rgba(30,144,255,.45);border-radius:18px;padding:16px;margin-bottom:16px;
}
.owner-img{
  width:130px;height:130px;object-fit:cover;border-radius:16px;
  border:2px solid rgba(30,144,255,.85);box-shadow:0 0 22px rgba(30,144,255,.75);
}
.owner-label{font-size:12.5px;color:#9fb8d8;font-weight:700;margin-bottom:5px}
.copy-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.owner-name{
  font-size:clamp(15px,3.4vw,20px);font-weight:900;color:#ffd54a;
  text-shadow:0 0 14px rgba(255,213,74,.7);word-break:break-all;
}
.copy-btn{
  padding:8px 14px;border-radius:10px;border:1px solid rgba(0,242,254,.7);
  background:rgba(0,242,254,.12);color:#7fe9ff;font-weight:800;font-size:13px;cursor:pointer;transition:.2s;
}
.copy-btn:hover{background:rgba(0,242,254,.3);box-shadow:0 0 16px rgba(0,242,254,.8)}
.qr-img{
  display:block;width:min(100%,320px);margin:12px auto;border-radius:16px;
  border:2px solid rgba(30,144,255,.75);box-shadow:0 0 26px rgba(30,144,255,.6);
}
.bank-box{
  background:linear-gradient(160deg,rgba(16,48,107,.7),rgba(8,21,47,.92));
  border:1px solid rgba(255,213,74,.45);border-radius:16px;padding:16px;
}
.bank-box .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(30,144,255,.25);font-size:14.5px}
.bank-box .row:last-child{border:none}
.bank-box .row b{color:#ffd54a;font-weight:900}

/* ĐƠN HÀNG */
.order{
  background:linear-gradient(160deg,rgba(16,48,107,.7),rgba(8,21,47,.92));
  border:1px solid rgba(30,144,255,.4);border-radius:16px;padding:14px;margin-bottom:13px;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}
.order .o-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.o-code{font-weight:900;color:#7fe9ff;font-size:15px;letter-spacing:1px}
.o-line{font-size:14px;color:#c8ddf5;margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap}
.o-line b{color:#ffd54a}
.badge{
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900;display:inline-block;
}
.badge-wait{background:rgba(255,180,0,.16);color:#ffc63d;border:1px solid rgba(255,180,0,.55)}
.badge-ok{background:rgba(0,230,118,.16);color:#3ddc84;border:1px solid rgba(0,230,118,.6)}
.btn-done{
  width:100%;margin-top:10px;padding:12px;border-radius:12px;border:none;cursor:pointer;
  font-weight:900;font-size:14px;color:#04220f;
  background:linear-gradient(135deg,#00e676,#00a152);
  box-shadow:0 0 18px rgba(0,230,118,.75);animation:blink 1.6s ease-in-out infinite;
}
@keyframes blink{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.done-note{
  margin-top:9px;font-size:13px;color:#ffd54a;font-weight:700;
  background:rgba(255,213,74,.09);border:1px dashed rgba(255,213,74,.45);
  border-radius:11px;padding:9px;
}

/* HỖ TRỢ */
.support-icon{
  font-size:74px;text-align:center;margin:10px 0 18px;
  filter:drop-shadow(0 0 22px rgba(30,144,255,.9));animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
.support-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.sup-btn{
  padding:14px 28px;border-radius:14px;font-weight:900;font-size:15px;
  text-decoration:none;color:#fff;transition:.25s;border:1px solid rgba(255,255,255,.2);
}
.sup-btn.tt{background:linear-gradient(135deg,#25f4ee,#000,#fe2c55);box-shadow:0 0 20px rgba(254,44,85,.6)}
.sup-btn.zl{background:linear-gradient(135deg,#0068ff,#00b4ff);box-shadow:0 0 20px rgba(0,104,255,.7)}
.sup-btn:hover{transform:translateY(-3px) scale(1.04);filter:brightness(1.15)}

/* ĐÁNH GIÁ */
.stars{display:flex;justify-content:center;gap:10px;margin:14px 0}
.star{
  font-size:42px;color:#2a4470;cursor:pointer;transition:.18s;user-select:none;
  filter:drop-shadow(0 0 6px rgba(0,0,0,.5));
}
.star.on{color:#ffd54a;filter:drop-shadow(0 0 16px rgba(255,213,74,.95));transform:scale(1.14)}
.btn-main{
  width:100%;padding:14px;border-radius:13px;border:none;cursor:pointer;
  font-weight:900;font-size:15.5px;color:#04220f;margin-top:12px;
  background:linear-gradient(135deg,#00f2fe,#4facfe,#ffd54a);
  background-size:220% 100%;animation:shine 4s linear infinite;
  box-shadow:0 0 20px rgba(79,172,254,.75);transition:.2s;
}
.btn-main:hover{transform:translateY(-2px);filter:brightness(1.12)}
.review{
  background:rgba(30,144,255,.09);border:1px solid rgba(30,144,255,.3);
  border-radius:13px;padding:12px;margin-top:12px;
}
.review .rv-top{display:flex;justify-content:space-between;font-size:13px;color:#9fb8d8;margin-bottom:6px}
.rv-stars{color:#ffd54a;font-size:15px}
.thanks{
  margin-top:14px;padding:12px;border-radius:12px;font-size:13.5px;font-weight:700;color:#ffd54a;
  background:rgba(255,213,74,.1);border:1px dashed rgba(255,213,74,.5);
}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(2,7,18,.85);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:1100;padding:18px;
  opacity:0;visibility:hidden;transition:.28s;
}
.modal.show{opacity:1;visibility:visible}
.modal-box{
  width:min(96vw,420px);max-height:90vh;overflow-y:auto;
  background:linear-gradient(160deg,#0d2450,#08152f);
  border:2px solid rgba(30,144,255,.75);border-radius:20px;padding:18px;
  box-shadow:0 0 44px rgba(30,144,255,.65);transform:scale(.88);transition:.28s;
}
.modal.show .modal-box{transform:scale(1)}
.modal-box img.pm-img{
  width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin-bottom:12px;
  border:1px solid rgba(30,144,255,.5);
}
.pm-name{font-weight:900;font-size:19px;text-align:center;color:#cfe6ff;margin-bottom:4px}
.pm-price{
  text-align:center;font-weight:900;font-size:22px;margin-bottom:12px;
  background:linear-gradient(90deg,#ffd54a,#ff9d2e,#ff6ec7);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;
  border-radius:12px;border:1px solid rgba(30,144,255,.45);
  background:rgba(30,144,255,.08);color:#dceaff;font-weight:700;font-size:14.5px;
  cursor:pointer;transition:.2s;font-family:inherit;
}
.opt:hover{background:rgba(30,144,255,.22);border-color:#4facfe}
.opt.sel{background:linear-gradient(135deg,rgba(0,230,118,.28),rgba(0,242,254,.18));border-color:#3ddc84;box-shadow:0 0 16px rgba(0,230,118,.6)}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:13px;border:none;font-weight:900;font-size:15px;cursor:pointer;transition:.2s}
.btn-cancel{background:linear-gradient(135deg,#ff4d4d,#b30000);color:#fff;box-shadow:0 0 16px rgba(255,80,80,.65)}
.btn-buy{background:linear-gradient(135deg,#00e676,#00a152);color:#04220f;box-shadow:0 0 18px rgba(0,230,118,.8)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.13)}
.confirm-text{
  text-align:center;font-weight:900;font-size:16px;color:#ffd54a;margin:10px 0 6px;
  text-shadow:0 0 14px rgba(255,213,74,.7);
}
.confirm-name{
  text-align:center;font-size:20px;font-weight:900;color:#7fe9ff;margin-bottom:12px;
  word-break:break-all;
}
.f-input{
  width:100%;padding:12px 14px;border-radius:12px;margin-bottom:8px;
  border:1px solid rgba(30,144,255,.5);background:rgba(5,14,36,.9);
  color:#e8f2ff;font-size:15px;font-family:inherit;outline:none;
}
.f-input:focus{border-color:#4facfe;box-shadow:0 0 16px rgba(30,144,255,.6)}
.f-price{text-align:center;font-weight:900;font-size:18px;color:#ffd54a;margin-bottom:10px}

/* TOAST */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);
  background:linear-gradient(135deg,#0d2450,#12336e);
  border:1px solid rgba(0,242,254,.75);color:#dff6ff;font-weight:800;font-size:14px;
  padding:13px 22px;border-radius:14px;z-index:1200;opacity:0;pointer-events:none;
  transition:.35s;box-shadow:0 0 24px rgba(0,242,254,.7);max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:11px}
  .card-name{font-size:13px;min-height:34px}
  .card-price{font-size:15px}
  #view{padding:96px 12px 80px}
}
</style>
</head>
<body>

<div class="frame"></div>

<!-- THANH TIÊU ĐỀ -->
<div id="titleBar" onclick="go('home')">
  <div class="title-text">SHOP BÁN TRÁI BLOX FRUIT VÀ NHỮNG PHỤ KIỆN KHÁC🔑</div>
</div>

<!-- LOADER -->
<div id="loader">
  <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
  <div class="load-pct" id="loadPct">0%</div>
</div>

<!-- NÚT MENU -->
<button id="menuBtn">☰</button>

<!-- DRAWER -->
<nav id="drawer">
  <div class="drawer-head">☰ MENU SHOP</div>
  <a onclick="go('profile')">👤 Hồ sơ</a>
  <a onclick="go('owner')">🔑 Chủ ACC CHÍNH</a>

/* =========================================================
   TIỆN ÍCH
========================================================= */
function p2(n){return String(n).padStart(2,'0');}
function fmtTime(t){
  const d=new Date(t);
  return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Mã ngẫu nhiên 1-9 chữ số, đảo lộn */
function genCode(){
  const len = Math.floor(Math.random()*5)+5; // 5 -> 9 chữ số
  return shuffle([1,2,3,4,5,6,7,8,9]).slice(0,len).join('');
}
function fmtVnd(v){
  if(v>=1000){
    let k=v/1000;
    let s=(Math.round(k*10)/10).toString();
    if(s.indexOf('.')>-1) s=s.replace('.',',');
    return s+'k';
  }
  return v+'đ';
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Đã sao chép: '+txt)).catch(()=>toast('Không sao chép được'));
  } else {
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');toast('Đã sao chép: '+txt);}catch(e){toast('Không sao chép được');}
    document.body.removeChild(ta);
  }
}

/* =========================================================

========================================================= */
let pct=0;
const fillEl=document.getElementById('loadFill');
const pctEl=document.getElementById('loadPct');
const titleBar=document.getElementById('titleBar');

const loadTimer=setInterval(()=>{
  pct += Math.random()*6.5 + 2.2;
  if(pct>=100){pct=100;clearInterval(loadTimer);finishLoading();}
  fillEl.style.width=pct+'%';
  pctEl.textContent=Math.floor(pct)+'%';
},85);

function finishLoading(){
  setTimeout(()=>{
    titleBar.classList.add('loaded');          // tiêu đề bay lên vị trí cao nhất
    const ld=document.getElementById('loader');
    ld.style.opacity='0';
    setTimeout(()=>{
      ld.style.display='none';
      document.getElementById('site').classList.add('show');
      document.getElementById('menuBtn').classList.add('show');
      adjustPadding();
      initUser();
    },480);
  },420);
}

function adjustPadding(){

}

    document.getElementById('nameModal').classList.add('show');

function renderView(v){
  currentView=v;

  let html='';
  switch(v){
    case 'home': html=viewHome(); break;
    case 'profile': html=viewProfile(); break;
    case 'owner': html=viewOwner(); break;
    case 'fruits': html=viewFruits(); break;

}

/* ---------- ĐƠN MUA HÀNG ---------- */
function canComplete(o){
  const d=new Date(o.time);
  const t=new Date(d);
  t.setHours(20,0,0,0);
  return Date.now()>=t.getTime();
}
function orderCardHTML(o){
  let status='';
  if(o.status==='completed'){
    status=`<span class="badge badge-ok">Hoàn thành ✅</span>`;
  } else {
    status=`<span class="badge badge-wait">Đang xử lý</span>`;
  }
  let extra='';
  if(o.status==='processing'&&canComplete(o)){
    extra=`<button class="btn-done" onclick="completeOrder('${o.id}')">✅ Đơn hàng đã hoàn thành</button>`;
  }
  if(o.status==='completed'){
    extra=`<div class="done-note">Vui lòng chụp ảnh đơn hàng đã hoàn thành và gửi qua phần hỗ trợ hoặc tik tok ạ cảm ơn khách hàng nhiều.</div>`;
  }
  return `<div class="order">
    <div class="o-head">
      <span class="o-code">🧾 Mã đơn: ${o.code}</span>
      ${status}
    </div>
    <div class="o-line"><span>🛒 Sản phẩm:</span><b>${o.item}</b></div>
    <div class="o-line"><span>💰 Giá:</span><b>${o.price}</b></div>
    <div class="o-line"><span>📅 Ngày mua:</span><b>${fmtTime(o.time)}</b></div>
    ${extra}
  </div>`;
}
function viewOrders(){
  const u=getUser()||{orders:[]};
  const list=(u.orders||[]).slice().reverse();
  if(!list.length) return `<h2 class="sec-title">🧾 ĐƠN MUA HÀNG</h2>
    <div class="panel" style="text-align:center"><p class="muted">Bạn chưa có đơn hàng nào.</p></div>`;
  return `<h2 class="sec-title">🧾 ĐƠN MUA HÀNG</h2>
    <p class="muted">Đơn hàng được lưu vĩnh viễn, kể cả khi tải lại trang</p>
    ${list.map(orderCardHTML).join('')}`;
}

/* ---------- LỊCH SỬ ---------- */
function viewHistory(){
  const u=getUser()||{orders:[]};
  const list=(u.orders||[]).slice().reverse();
  if(!list.length) return `<h2 class="sec-title">📜 LỊCH SỬ</h2>
    <div class="panel" style="text-align:center"><p class="muted">Chưa có lịch sử giao dịch.</p></div>`;
  return `<h2 class="sec-title">📜 LỊCH SỬ</h2>
    <p class="muted">Toàn bộ đơn hàng đã mua của quý khách</p>
    ${list.map(orderCardHTML).join('')}`;
}

function completeOrder(id){
  const u=getUser();
  const o=(u.orders||[]).find(x=>x.id===id);
  if(!o) return;
  if(!confirm('Xác nhận đơn hàng '+o.code+' đã hoàn thành?')) return;
  o.status='completed';
  o.completedAt=Date.now();
  saveUser(u);
  toast('Đơn hàng đã hoàn thành ✅');
  renderView(currentView);
}

/* ---------- ĐÁNH GIÁ ---------- */
let ratingStars=0;
function viewRating(){
  const list=getRatings();
  return `
  <h2 class="sec-title">⭐ ĐÁNH GIÁ</h2>
  <p class="muted">Khách hàng có thể chọn từ 1-5 sao tuỳ theo nhu cầu khi sử dụng dịch vụ</p>
  <div class="stars" id="starBox">
    ${[1,2,3,4,5].map(i=>`<span class="star" data-s="${i}" onclick="setStar(${i})">★</span>`).join('')}
  </div>
  <textarea id="rateText" class="ta" rows="4" placeholder="Mô tả cảm nhận của bạn về shop..."></textarea>
  <button class="btn-main" onclick="submitRating()">📨 Gửi đánh giá</button>
  <div id="rateMsg"></div>
  <div style="margin-top:18px">
    ${list.slice().reverse().map(r=>`
      <div class="review">
        <div class="rv-top"><b style="color:#7fe9ff">${r.name}</b><span>${fmtTime(r.time)}</span></div>
        <div class="rv-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div>
        <div style="margin-top:5px;font-size:14px;color:#c8ddf5">${r.text||'(Không có mô tả)'}</div>
      </div>`).join('')}
  </div>`;
}
function setStar(n){
  ratingStars=n;
  document.querySelectorAll('#starBox .star').forEach(s=>{
    s.classList.toggle('on', parseInt(s.dataset.s)<=n);
  });
}
function getRatings(){
  try{return JSON.parse(localStorage.getItem(LS_RATE))||[];}catch(e){return [];}
}
function submitRating(){
  if(!ratingStars){toast('Vui lòng chọn số sao từ 1-5 ⭐');return;}
  const txt=document.getElementById('rateText').value.trim();
  const u=getUser()||{name:'Khách hàng'};
  const list=getRatings();
  list.push({name:u.name||'Khách hàng',stars:ratingStars,text:txt,time:Date.now()});
  localStorage.setItem(LS_RATE,JSON.stringify(list));
  ratingStars=0;
  toast('Cảm ơn bạn đã đánh giá 🎉');
  renderView('rating');
  const msg=document.getElementById('rateMsg');
  if(msg){
    msg.innerHTML=`<div class="thanks">Vui lòng chụp ảnh lại phần khách hàng mới mô tả về shop mà gửi qua tik tok hoặc zalo cho bên shop ạ. Xin cảm ơn quý khách 🎉</div>`;
  }
}

/* =========================================================
   MODAL SẢN PHẨM + ĐẶT HÀNG
========================================================= */
let curItem=null, curChoice=null, curPrice=null;

function openProduct(id){
  const it=ALL.find(x=>x.id===id);
  if(!it) return;
  curItem=it; curChoice=null; curPrice=null;
  renderProductModal('select');
  document.getElementById('productModal').classList.add('show');
}
function closeProduct(){
  document.getElementById('productModal').classList.remove('show');
}

function renderProductModal(step){
  const box=document.getElementById('pmBox');
  const u=getUser()||{name:''};

  if(step==='select'){
    let optsHTML='';
    if(curItem.customF){
      optsHTML=`
        <button class="opt" onclick="pickF(5000,this)">5k F = 7,5k</button>
        <button class="opt" onclick="pickF(10000,this)">10k F = 15k</button>
        <button class="opt" onclick="pickF(20000,this)">20k F = 30k</button>
        <div style="margin-top:10px;font-weight:800;font-size:13.5px;color:#7fd3ff">Tuỳ chỉnh số F muốn riad (5.000 – 100.000 F)</div>
        <input class="f-input" id="fInput" type="number" min="5000" max="100000" step="1000"
          placeholder="Nhập số F..." oninput="onFInput()" style="margin-top:8px">
        <div class="f-price" id="fPrice">1.500đ / 1 F</div>`;
    } else if(curItem.options){
      optsHTML=curItem.options.map((o,i)=>
        `<button class="opt" onclick="pickOpt(${i},this)">${o.l} — ${o.p}</button>`).join('');
    } else {
      optsHTML=`<div class="opt sel" style="cursor:default">Sản phẩm: ${curItem.name}</div>`;
      curChoice=curItem.name; curPrice=curItem.price;
    }

    box.innerHTML=`
      <img class="pm-img" src="${curItem.img}" alt="${curItem.name}">
      <div class="pm-name">${curItem.name}</div>
      <div class="pm-price">${curItem.price}</div>
      ${optsHTML}
      <div style="margin-top:12px;font-size:13.5px;color:#9fb8d8">
        👤 Khách hàng: <b style="color:#ffd54a">${u.name||'Chưa có tên'}</b>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeProduct()">Huỷ ❌</button>
        <button class="btn btn-buy" id="buyBtn" onclick="goConfirm()">Mua ✅</button>
      </div>`;
  }

  if(step==='confirm'){
    box.innerHTML=`
      <div class="pm-name">🧾 XÁC NHẬN ĐƠN HÀNG</div>
      <div class="pm-price">${curPrice}</div>
      <div class="confirm-text">Vui lòng xác nhận lại tên của quý khách…</div>
      <div class="confirm-name">${u.name||''}</div>
      <div style="font-size:13.5px;color:#9fb8d8;text-align:center;margin-bottom:6px">
        Sản phẩm: <b style="color:#ffd54a">${curChoice}</b>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="renderProductModal('select')">Huỷ ❌</button>
        <button class="btn btn-buy" onclick="placeOrder()">Xác nhận ✅</button>
      </div>`;
  }

  if(step==='done'){
    box.innerHTML=`
      <div style="text-align:center;font-size:56px;margin:6px 0 10px">🎉</div>
      <div class="pm-name">ĐẶT HÀNG THÀNH CÔNG</div>
      <div class="confirm-text">Mã đơn của bạn</div>
      <div class="confirm-name" style="letter-spacing:5px;font-size:26px">${window._lastCode||''}</div>
      <div style="font-size:13.5px;color:#9fb8d8;text-align:center;margin-bottom:12px">
        Đơn hàng đã được lưu vào <b style="color:#ffd54a">Đơn mua hàng</b> & <b style="color:#ffd54a">Lịch sử</b>.<br>
        Trạng thái hiện tại: <b style="color:#ffc63d">Đang xử lý</b>
      </div>
      <div class="modal-actions">
        <button class="btn btn-buy" style="flex:1" onclick="closeProduct();go('orders')">Xem đơn hàng ✅</button>
      </div>`;
  }
}

function pickOpt(i,el){
  document.querySelectorAll('#pmBox .opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  curChoice=curItem.name+' — '+curItem.options[i].l;
  curPrice=curItem.options[i].p;
}
function pickF(v,el){
  document.querySelectorAll('#pmBox .opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  const inp=document.getElementById('fInput');
  if(inp) inp.value=v;
  const price=Math.round(v*1.5);
  curChoice='Cày điểm F — '+v.toLocaleString('vi-VN')+' F';
  curPrice=fmtVnd(price);
  const fp=document.getElementById('fPrice');
  if(fp) fp.textContent=v.toLocaleString('vi-VN')+' F = '+fmtVnd(price);
}
function onFInput(){
  const inp=document.getElementById('fInput');
  const fp=document.getElementById('fPrice');
  let v=parseInt(inp.value||'0',10);
  if(!v){fp.textContent='1.500đ / 1 F';curChoice=null;curPrice=null;return;}
  if(v<5000) v=5000;
  if(v>100000) v=100000;
  const price=Math.round(v*1.5);
  curChoice='Cày điểm F — '+v.toLocaleString('vi-VN')+' F';
  curPrice=fmtVnd(price);
  fp.textContent=v.toLocaleString('vi-VN')+' F = '+fmtVnd(price);
}

function goConfirm(){
  if(!curChoice||!curPrice){
    toast('Vui lòng chọn sản phẩm / số F trước!');
    return;
  }
  renderProductModal('confirm');
}

function placeOrder(){
  const u=getUser();
  if(!u){
    toast('Không tìm thấy tài khoản, vui lòng tải lại trang');
    return;
  }
  if(!u.name){
    toast('Vui lòng nhập tên khách hàng trước');
    return;
  }
  const code=genCode();
  const order={
    id:'o'+Date.now()+Math.floor(Math.random()*9999),
    code:code,
    item:curChoice,
    price:curPrice,
    time:Date.now(),
    status:'processing'
  };
  if(!u.orders) u.orders=[];
  u.orders.push(order);
  saveUser(u);
  window._lastCode=code;
  renderProductModal('done');
  toast('Đặt hàng thành công! Mã đơn: '+code);
}

/* Đóng modal khi bấm nền */
document.getElementById('productModal').addEventListener('click',function(e){
  if(e.target===this) closeProduct();
});

/* Đóng drawer khi nhấn ESC */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();closeProduct();}
});

/* Chặn zoom đúp trên mobile */
let lastTouch=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouch<=300) e.preventDefault();
  lastTouch=now;
},{passive:false});
</script>
